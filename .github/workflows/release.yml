# Push a version tag (for example v0.2.0) to build the extension for every
# browser and attach the zips to a GitHub Release. The download page links to
# releases/latest, so the newest release is what people get.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run compile
      - run: npm test

      - name: Build zips
        run: |
          npm run zip
          npm run zip:edge
          npm run zip:firefox

      # Fixed names keep the download links on the website the same for every release.
      - name: Rename zips
        run: |
          mkdir dist
          cp .output/*-chrome.zip dist/tab-tidy-chrome.zip
          cp .output/*-edge.zip dist/tab-tidy-edge.zip
          cp .output/*-firefox.zip dist/tab-tidy-firefox.zip
          cp .output/*-sources.zip dist/tab-tidy-sources.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Tab Tidy $GITHUB_REF_NAME" --generate-notes
